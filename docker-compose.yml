version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: dmr_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 2408
      MYSQL_DATABASE: dmr_db
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: dmr_backend
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html/DMR_project
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dmr_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 2408
    depends_on:
      - db

volumes:
  db_data:
